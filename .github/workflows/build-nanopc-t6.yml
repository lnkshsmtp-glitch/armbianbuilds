name: Build nanopc-t6 Armbian Image
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout your repository so the action can see the userpatches/ folder
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Run the Armbian build framework for a full OS image
      - name: Build Full Image
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: "nanopct6" # orangepi5 bananapif3
          armbian_release: "trixie" # trixie
          armbian_target: "build"
          armbian_kernel_branch: "current"
          armbian_ui: "gnome" # server xfce
          armbian_runner_clean: "yes" # recommended for Github runners

          # Using an inline hook argument to inject the package directly 
          # inside the runner's build process without needing pre-existing files.
          armbian_extra_vars: |
            inline_customize_image() {
              echo "Injecting custom matching kernel headers..."
              apt-get update
              apt-get install -y linux-headers-current-rockchip64
            }
