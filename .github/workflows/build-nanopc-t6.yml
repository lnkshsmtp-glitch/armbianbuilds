name: Build Armbian NanoPC-T6 Trixie GNOME + Coral TPU

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch (vendor = Rockchip 6.1 BSP, current = Mainline 6.18)"
        required: true
        default: "vendor"
        type: choice
        options:
          - vendor
          - current

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm # Use ubuntu-latest if you prefer x86_64 emulation
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
                     /usr/local/lib/android \
                     /opt/ghc \
                     /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build Armbian Image
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_target: "build"
          armbian_board: "nanopct6"
          armbian_release: "trixie"
          armbian_ui: "gnome"
          armbian_kernel_branch: ${{ inputs.kernel_branch }}
          armbian_extensions: "dkms-headers"
          armbian_compress: "sha,img,xz"
