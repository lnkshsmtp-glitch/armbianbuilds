# File: .github/workflows/build.yml
name: Build Armbian NanoPC-T6 Trixie GNOME (GPU + Video + Coral TPU + NPU)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "current = Mainline 6.18 (Native V4L2 + 1GHz Rocket NPU), vendor = Rockchip 6.1 BSP"
        required: true
        default: "current"
        type: choice
        options:
          - current
          - vendor

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm # Native ARM64 runner (or use ubuntu-latest)
    steps:
      - name: Free up runner disk space and install b4
        run: |
          sudo rm -rf /usr/share/dotnet \
                     /usr/local/lib/android \
                     /opt/ghc \
                     /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y b4 git
          df -h

      - name: Build Armbian Image
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_target: "build"
          armbian_board: "nanopct6"
          armbian_release: "trixie"
          armbian_ui: "gnome"
          armbian_kernel_branch: ${{ inputs.kernel_branch }}
          armbian_extensions: "dkms-headers"
          armbian_compress: "sha,img,xz"
